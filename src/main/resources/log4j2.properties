status = debug
name = SystemLogConfig

# Console Appender
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5level %logger{36} - %msg%n

# File Appender
appender.file.type = RollingFile
appender.file.name = FileAppender
appender.file.fileName = ${sys:LOG_DIR}/system.log
appender.file.filePattern = ${sys:LOG_DIR}/system-%i.log

# to clear the log file on each startup
appender.file.append = false

appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{HH:mm:ss} %-5level %logger{36} - %msg%n
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 2MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 1


# Root Logger
rootLogger.level = info
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.file.ref = FileAppender

# Hibernate SQL logging
logger.hibernateSQL.name = org.hibernate.SQL
logger.hibernateSQL.format = org.hibernate.SQL
logger.hibernateSQL.level = debug

logger.hibernate-slow.name = org.hibernate.SQL_SLOW
logger.hibernate-slow.level = info

# Hibernate parameter binding
logger.hibernateBind.name = org.hibernate.orm.jdbc.bind
logger.hibernateBind.level = trace